name: Build release installers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Packaging target
        type: choice
        default: all
        options:
          - all
          - macos-x64
          - macos-arm64
          - windows-x64

concurrency:
  group: release-installers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'all' && '["macos-x64","macos-arm64","windows-x64"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-2022' || matrix.target == 'macos-x64' && 'macos-15-intel' || 'macos-14' }}
    env:
      SUFFIX: ${{ matrix.target == 'windows-x64' && 'win-x64.exe' || matrix.target == 'macos-x64' && 'mac-x64.dmg' || 'mac-arm64.dmg' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          test "$(gh release view "v$version" --json isDraft --jq .isDraft)" = true
      - run: npm ci
      - name: Test, build and audit installer
        env:
          TARGET: ${{ matrix.target }}
        run: npm run package:select -- --target "$TARGET" --yes
      - name: Verify macOS signature and image
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          app=$(find "release/$TARGET" -maxdepth 2 -name 'ES Atlas.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict "$app"
          hdiutil verify "release/$TARGET/ES Atlas-$RELEASE_VERSION-$SUFFIX"
      - name: Upload verified installer to draft
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release/github
          artifact="ES.Atlas-$RELEASE_VERSION-$SUFFIX"
          cp "release/$TARGET/ES Atlas-$RELEASE_VERSION-$SUFFIX" "release/github/$artifact"
          gh release upload "v$RELEASE_VERSION" "release/github/$artifact"
